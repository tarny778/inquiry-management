
services:
  # データベース
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: inquiry_management_dev
      POSTGRES_USER: inquiry_app
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?DOCKER_POSTGRES_PASSWORDを.env.dockerに設定してください}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquiry_app -d inquiry_management_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # バックエンド
  backend:
    image: inquiry-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://inquiry_app:${DOCKER_POSTGRES_PASSWORD}@db:5432/inquiry_management_dev?sslmode=disable
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # フロントエンド
  frontend:
    image: inquiry-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
