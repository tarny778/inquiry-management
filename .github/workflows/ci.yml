
name: CI

# mainへのプッシュ、mainを対象とするプルリクエストで実行
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# リポジトリの読み取りだけを許可
permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    # CI専用のPostgreSQLデータベース
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inquiry_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inquiry_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # pytest用DBを標準の接続先とする
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inquiry_management_test?sslmode=disable

    steps:
      # --------------------------------------------------
      # 1. 環境の準備
      # --------------------------------------------------

      # GitHubに保存されているコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python環境を用意
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Go環境を用意（dbmateのインストールに使用）
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # dbmateをインストール
      - name: Install dbmate
        run: |
          go install github.com/amacneil/dbmate/v2@v2.37.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 2. データベースの準備
      # --------------------------------------------------

      # E2Eテスト用データベースを作成
      - name: Create E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host localhost \
            --username postgres \
            --dbname postgres \
            --command "CREATE DATABASE inquiry_management_e2e;"

      # --------------------------------------------------
      # 3. マイグレーション
      # --------------------------------------------------

      # pytest用DBにマイグレーションを適用
      - name: Run database migrations
        env:
          DBMATE_MIGRATIONS_DIR: db/migrations
        run: dbmate up

      # E2E用DBにマイグレーションを適用
      - name: Run E2E migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inquiry_management_e2e?sslmode=disable
          DBMATE_MIGRATIONS_DIR: db/migrations
        run: dbmate up

      # --------------------------------------------------
      # 4. Python環境の準備とバックエンドテスト
      # --------------------------------------------------

      # pytestが必要とするテスト環境設定を作成
      - name: Create test environment file
        run: |
          cat > .env.test <<'EOF'
          APP_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/inquiry_management_test?sslmode=disable
          CORS_ORIGINS=http://localhost:5173
          EOF

      # E2Eテストが必要とする環境設定を作成
      - name: Create E2E environment file
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          cat > .env.e2e <<EOF
          APP_ENV=e2e
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/inquiry_management_e2e?sslmode=disable
          CORS_ORIGINS=http://127.0.0.1:5173
          VITE_API_BASE_URL=http://127.0.0.1:8000
          E2E_TEST_PASSWORD=$E2E_TEST_PASSWORD
          EOF

      # E2E環境設定ファイルが正しく生成されたか確認
      - name: Verify E2E environment file
        run: |
          test -s .env.e2e
          grep -q '^APP_ENV=e2e$' .env.e2e
          grep -q '^DATABASE_URL=postgresql://postgres:postgres@localhost:5432/inquiry_management_e2e?sslmode=disable$' .env.e2e
          grep -q '^E2E_TEST_PASSWORD=.' .env.e2e
          echo ".env.e2e の生成と必須項目を確認しました（パスワードは表示していません）。"

      # Pythonライブラリをインストール
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # バックエンドのテスト
      - name: Run backend tests
        run: python -m pytest -v

      # E2E用の職員認証情報を登録
      - name: Set up E2E accounts
        run: python -m scripts.setup_e2e_accounts

      # --------------------------------------------------
      # 5. フロントエンド環境の準備と検査
      # --------------------------------------------------

      # Node.js環境を用意
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # フロントエンドのライブラリをインストール
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ESLintによるコードチェック
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      # TypeScriptの確認と本番用ビルド
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --------------------------------------------------
      # 6. PlaywrightによるE2Eテスト
      # --------------------------------------------------

      # Chromiumと実行に必要なOS依存パッケージをインストール
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # E2Eテストを実行
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
