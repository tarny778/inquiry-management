name: Deploy

# CI が main で成功したあとに、イメージを作って ECR に保存する
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write # AWS に、一時的な身分証を出すために必要
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  push-images:
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    # テストが成功した、main へのプッシュのときだけ実行する
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      # テストを通ったコミットを取得する
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # アクセスキーを使わず、OIDC で AWS に入る
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="$REGISTRY/inquiry-management/backend"
          docker buildx build --provenance=false --load -f Dockerfile.prod -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Build and push web image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="$REGISTRY/inquiry-management/web"
          docker buildx build --provenance=false --load -f frontend/Dockerfile.prod -t "$IMAGE:$TAG" -t "$IMAGE:latest" frontend
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  update-server:
    name: Update running server
    needs: push-images
    runs-on: ubuntu-latest
    concurrency:
      group: update-server
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the instance and check its state
        id: check
        run: |
          read -r ID STATE < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=inquiry-demo" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].[InstanceId,State.Name]" --output text)
          echo "instance=$ID state=$STATE"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Skip when the server is not running
        if: steps.check.outputs.state != 'running'
        run: echo "サーバーが停止中のため、更新をスキップします。次の起動時に最新になります。"

      - name: Deploy through SSM
        if: steps.check.outputs.state == 'running'
        env:
          INSTANCE_ID: ${{ steps.check.outputs.id }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo -u ec2-user bash /home/ec2-user/inquiry-management/scripts/deploy.sh $TAG\"]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)
          echo "command=$CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text
          [ "$STATUS" = "Success" ]